<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get AI Limits</title>
<meta name="description" content="Get AI Limits on the App Store or Google Play.">
<script>
// Ads and social posts link here: send each phone straight to its own store.
// get.html?src=threads&c=launch tags the visit, so the stores can tell which network it came from:
// Google Play gets it as utm_source/utm_campaign (the app also passes it along with a purchase),
// the App Store as a campaign link (ct), which App Store Connect › App Analytics shows per campaign.
(function () {
  // App Store Connect › App Analytics › Acquisition › Campaigns › Generate Campaign Link shows this as "pt=".
  var APPLE_PROVIDER_TOKEN = "129568531";
  var q = new URLSearchParams(location.search);
  var tag = function (v) { return (v || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24); };
  var src = tag(q.get("src")), c = tag(q.get("c"));
  var play = "https://play.google.com/store/apps/details?id=com.stas.ailimits";
  var apple = "https://apps.apple.com/app/id6819589802";
  if (src) {
    var ref = "utm_source=" + src + "&utm_medium=social" + (c ? "&utm_campaign=" + c : "");
    play += "&referrer=" + encodeURIComponent(ref);
    if (APPLE_PROVIDER_TOKEN) apple = "https://apps.apple.com/app/apple-store/id6819589802?pt=" + APPLE_PROVIDER_TOKEN + "&ct=" + (c ? src + "-" + c : src) + "&mt=8";
  }
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
  if (ios) location.replace(apple);
  else if (/Android/.test(ua)) location.replace(play);
  else document.addEventListener("DOMContentLoaded", function () {
    // On a computer the buttons carry the same tags.
    document.querySelectorAll('a[href^="https://apps.apple.com"]').forEach(function (a) { a.href = apple; });
    document.querySelectorAll('a[href^="https://play.google.com"]').forEach(function (a) { a.href = play; });
  });
})();
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f2f4;
  --text: #0c0e11;
  --text2: rgba(12, 14, 18, 0.62);
  --button: #0c0e11;
  --button-text: #ffffff;
  --accent: #0b8b9d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --text: #f3f4f6;
    --text2: rgba(236, 239, 243, 0.62);
    --button: #f3f4f6;
    --button-text: #000000;
    --accent: #78dbe6;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 72px 20px 64px;
  text-align: center;
}

h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; }
.lead { font-size: 20px; color: var(--text2); margin: 0 0 32px; }
.stores { display: flex; flex-direction: column; gap: 12px; }
.stores a {
  display: block;
  padding: 16px 20px;
  border-radius: 14px;
  background: var(--button);
  color: var(--button-text);
  font-weight: 600;
  text-decoration: none;
}
.more { margin-top: 32px; font-size: 15px; }
.more a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
<h1>AI Limits</h1>
<p class="lead">All your AI usage limits and reset times in one place.</p>
<div class="stores">
<a href="https://apps.apple.com/app/id6819589802">Download on the App Store</a>
<a href="https://play.google.com/store/apps/details?id=com.stas.ailimits">Get it on Google Play</a>
</div>
<p class="more"><a href="./">About AI Limits</a></p>
</main>
</body>
</html>
