<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get AI Limits</title>
<meta name="description" content="Get AI Limits on the App Store or Google Play.">
<script>
// Ads link here: send each phone straight to its own store.
(function () {
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
  if (ios) location.replace("https://apps.apple.com/app/id6819589802");
  else if (/Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.stas.ailimits");
})();
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f2f4;
  --text: #0c0e11;
  --text2: rgba(12, 14, 18, 0.62);
  --button: #0c0e11;
  --button-text: #ffffff;
  --accent: #0b8b9d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --text: #f3f4f6;
    --text2: rgba(236, 239, 243, 0.62);
    --button: #f3f4f6;
    --button-text: #000000;
    --accent: #78dbe6;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 72px 20px 64px;
  text-align: center;
}

h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; }
.lead { font-size: 20px; color: var(--text2); margin: 0 0 32px; }
.stores { display: flex; flex-direction: column; gap: 12px; }
.stores a {
  display: block;
  padding: 16px 20px;
  border-radius: 14px;
  background: var(--button);
  color: var(--button-text);
  font-weight: 600;
  text-decoration: none;
}
.more { margin-top: 32px; font-size: 15px; }
.more a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
<h1>AI Limits</h1>
<p class="lead">All your AI usage limits and reset times in one place.</p>
<div class="stores">
<a href="https://apps.apple.com/app/id6819589802">Download on the App Store</a>
<a href="https://play.google.com/store/apps/details?id=com.stas.ailimits">Get it on Google Play</a>
</div>
<p class="more"><a href="./">About AI Limits</a></p>
</main>
</body>
</html>
